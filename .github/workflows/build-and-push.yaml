name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per-version build counter (e.g. :dsh-0.2.0-rc.2-1, then -2 when a later
      # build keeps the same pinned harness version). Consumers pin the
      # versioned tag; `latest` is for convenience only.
      - name: Resolve image tags
        id: tags
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DSH_VERSION=$(sed -nE 's#^ARG DSH_VERSION=(.*)$#\1#p' Dockerfile | head -n1 | tr -d '[:space:]')
          # The first build of a version is always -1, including when the GHCR
          # package does not exist yet and the tag listing 404s.
          BUILD=1
          if [ -n "${DSH_VERSION}" ]; then
            TOKEN=$(curl -fsSL -u "${GITHUB_ACTOR}:${REGISTRY_TOKEN}" \
              "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY}:pull" \
              | jq -r .token) || TOKEN=""
            if [ -n "${TOKEN}" ] && [ "${TOKEN}" != "null" ]; then
              NEXT=$(curl -fsSL -H "Authorization: Bearer ${TOKEN}" \
                "https://ghcr.io/v2/${GITHUB_REPOSITORY}/tags/list" \
                | jq -r --arg p "dsh-${DSH_VERSION}-" \
                  '[.tags[]? | select(startswith($p)) | .[($p | length):] | tonumber?] | if length == 0 then 1 else (max + 1) end') || NEXT=""
              case "${NEXT}" in
                '' | *[!0-9]*) NEXT=1 ;;
              esac
              BUILD="${NEXT}"
            fi
          fi
          {
            echo "tags<<__TAGS__"
            echo "ghcr.io/${GITHUB_REPOSITORY}:latest"
            if [ -n "${DSH_VERSION}" ]; then
              echo "ghcr.io/${GITHUB_REPOSITORY}:dsh-${DSH_VERSION}-${BUILD}"
            fi
            echo "__TAGS__"
          } >> "${GITHUB_OUTPUT}"
          echo "resolved dsh version: ${DSH_VERSION:-<none>}, build: ${BUILD}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=dsh-tools
            org.opencontainers.image.description=DeepSeek Harness (dsh) agent runtime
